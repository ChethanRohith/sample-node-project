name: Reusable Docker Build & Publish

on:
  workflow_call:
    secrets:
      CR_PAT:
        description: GitHub Container Registry Personal Access Token
        required: true
      DB_CONNECTION_STRING:
        description: Database connection string for application
        required: false
    outputs:
      image-tag:
        description: The image reference with registry
        value: ${{ jobs.docker-build.outputs.image-ref }}
      image-digest:
        description: The digest of the published image
        value: ${{ jobs.docker-build.outputs.digest }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image-ref.outputs.ref }}
      image-tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.run_number }}-${{ github.sha }}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Generate image reference
        id: image-ref
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}-${{ github.sha }}"
          echo "ref=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "🐳 Published: ${IMAGE_REF}"

      - name: Log image details
        run: |
          echo "✅ Image built and pushed successfully"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
