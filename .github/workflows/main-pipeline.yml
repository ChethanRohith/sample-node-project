name: GlobalCart CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting checks
        run: npm run lint --if-present || echo "No lint script defined"

      - name: Run unit tests
        run: npm test -- --passWithNoTests

  build-and-push:
    name: Build & Publish Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/shared-docker.yml
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

  deploy:
    name: Deploy to Production
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
      url: http://localhost:3000
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify deployment parameters
        run: |
          echo "✓ Deployment approved for Production"
          echo "✓ Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "✓ Triggered by: ${{ github.actor }}"
          echo "✓ Commit: ${{ github.sha }}"

      - name: Mock Deployment Step
        run: |
          echo "🚀 Deploying GlobalCart to Production..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Build: ${{ github.run_number }}"
          echo "Deployment approved and executing..."

      - name: Log deployment success
        run: |
          echo "✅ Deployment completed successfully"
          echo "Deployment approved and executing..."

      - name: Log deployment details
        run: |
          echo "Deployment timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Deployed by: ${{ github.actor }}"
          echo "Commit SHA: ${{ github.sha }}"
